# Every protocol on one controller: the union of nodes/dcdc and nodes/pdu, plus
# the genset (nodes/genset/src, built only here), with XCP, UDS and AUTOSAR by
# their snippets (see CMakeLists.txt).
CONFIG_CAN=y
CONFIG_LOG=y

CONFIG_ZELOS_CAN=y
CONFIG_ZELOS_CODEC_BENCH=y
CONFIG_ZELOS_CODEC_GENSET=y
CONFIG_ZELOS_J1939=y
CONFIG_ZELOS_CANOPEN=y

# As nodes/pdu has them.
CONFIG_CANOPENNODE_LEDS=n
CONFIG_CANOPENNODE_SDO_BUFFER_SIZE=889

# RX FIFO overruns, for the coexistence suite (UDS DID 0x0110).
CONFIG_STATS=y
CONFIG_CAN_STATS=y

# zelos_goose_start() encodes a trial frame on main's stack, about 1 KB.
CONFIG_MAIN_STACK_SIZE=2048
