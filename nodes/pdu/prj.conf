# Classic CAN, 8-byte frames, so the same firmware works against a physical
# adapter unchanged.
CONFIG_CAN=y

# Each node logs what it is on startup.
CONFIG_LOG=y

# The CANopen stack, run around this node's object dictionary in od/.
CONFIG_ZELOS_CANOPEN=y

# No status LEDs to drive, and nothing to persist: settings stay off, and with
# them the stack's storage.
CONFIG_CANOPENNODE_LEDS=n

# CO_process and the node's logic run on the main thread.
CONFIG_MAIN_STACK_SIZE=2048

# Block SDO transfers of up to 127 segments, as a device with long objects
# offers them. The default, 32, would answer in blocks of 4.
CONFIG_CANOPENNODE_SDO_BUFFER_SIZE=889
