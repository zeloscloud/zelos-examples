# Classic CAN, 8-byte frames with 29-bit identifiers.
CONFIG_CAN=y

# Each node logs what it is on startup.
CONFIG_LOG=y

# A J1939 ECU by nature, so J1939 is on here rather than by snippet. The bench
# codec reads the VCU's mode, which sets the load; the genset codec packs EEC1
# and ET1.
CONFIG_ZELOS_CAN=y
CONFIG_ZELOS_CODEC_BENCH=y
CONFIG_ZELOS_CODEC_GENSET=y
CONFIG_ZELOS_J1939=y
