# The console is the node's only interface: Zephyr's log and its shell share
# the board's console UART.
CONFIG_LOG=y
CONFIG_SHELL=y

# Deferred logging, so the 50 Hz loop copies a message into a buffer and never
# waits on the UART. The buffer holds about a second of the loop's output, so
# the UART can fall that far behind before the oldest message is dropped.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096

# Flush every message. The default waits for ten, which delivers the 50 Hz
# lines in bursts of 200 ms and puts command replies among stale lines.
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
