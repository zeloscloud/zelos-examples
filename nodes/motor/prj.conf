# A motor controller whose debug interface is its serial console: Zephyr's log
# and its shell share the board's console UART.
CONFIG_LOG=y
CONFIG_SHELL=y

# Deferred logging, so the control loop copies a message into a buffer and
# never waits on the UART. 16 KiB holds about a second of output at full rate.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
# Flush every message, so command replies never land among stale lines.
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
# printk goes through the log too, unprefixed: the Teleplot points.
CONFIG_LOG_PRINTK=y

# The control law runs in single-precision float on the Cortex-M7's FPU, and
# the log prints floats.
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# LEDs, the user button, and the die temperature and VREF sensors.
CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_ADC=y

# CPU load, from the scheduler's own cycle accounting.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE_ALL=y

# Why the board last reset: power-on, pin, software, watchdog or a crash.
CONFIG_HWINFO=y

# The hardware watchdog: a stalled control loop resets the board.
CONFIG_WATCHDOG=y

# Tuning saved to flash, so it survives a reset. ZMS, not NVS: NVS addresses
# at most 64 KiB sectors, and the STM32H7 erases 128 KiB at a time.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y

# A crash prints its dump, records where it happened, and the board restarts,
# as a field unit would; main.c's fatal error handler does the restart.
CONFIG_REBOOT=y
CONFIG_THREAD_NAME=y

# The control loop, the health thread and the shell all use the FPU.
CONFIG_FPU_SHARING=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
