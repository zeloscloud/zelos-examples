# Link and a static IPv4 address on the board's RMII MAC: `-S ethernet`. The
# node starts it with zelos_eth_start().
CONFIG_ZELOS_ETH=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4_IGMP=y
CONFIG_NET_IPV4_ACD=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
# lib/eth sets the address. net_config's init (and its AUTO_INIT) would hold
# boot up to 30 s waiting for a link.
CONFIG_NET_CONFIG_SETTINGS=n

CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=12
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48

# Every network thread below every CAN protocol's (UDS is at 6).
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_TC_THREAD_PRIO_CUSTOM=y
CONFIG_NET_TC_RX_THREAD_BASE_PRIO=7
CONFIG_NET_TCP_WORKER_PRIO=7
CONFIG_ETH_STM32_HAL_RX_THREAD_PRIO=7

# Multicast the MAC is not told to join is dropped in hardware.
CONFIG_ETH_STM32_MULTICAST_FILTER=y

# Counters for the health DID (0x0111).
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_LOG=y
