# Add a UDS server to a node: `-S uds`. The node starts it with zelos_uds_start().
CONFIG_ZELOS_UDS=y

# ISO-TP's receive pool holds one largest request: 19 x 56 >= ZELOS_UDS_BUF_SIZE.
CONFIG_ISOTP_RX_BUF_COUNT=19
# Frames padded to 8 bytes, as most testers send and expect.
CONFIG_ISOTP_ENABLE_TX_PADDING=y
# The stack logs every flow control it ignores at INF.
CONFIG_ISOTP_LOG_LEVEL_WRN=y
