name: firmware toolchain
description: >
  just, the toolchain image and the west workspace, restored from the Actions
  cache so a firmware job only compiles.

runs:
  using: composite
  steps:
    - uses: extractions/setup-just@v4
      with:
        just-version: "1.58.0"

    - id: toolchain
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        echo "tag=$(just --evaluate TOOLCHAIN)" >> "$GITHUB_OUTPUT"
        echo "zephyr=$(just --evaluate ZEPHYR)" >> "$GITHUB_OUTPUT"

    # The image the justfile would build, from cached layers. Its tag carries the
    # Dockerfile's hash, so the justfile then finds it and builds nothing.
    - uses: docker/setup-buildx-action@v4
    - uses: docker/build-push-action@v7
      with:
        context: toolchain
        build-args: ZEPHYR_VERSION=${{ steps.toolchain.outputs.zephyr }}
        tags: ${{ steps.toolchain.outputs.tag }}
        load: true
        cache-from: type=gha,scope=toolchain
        cache-to: type=gha,scope=toolchain,mode=max

    # The west workspace as a host directory rather than a volume, so it can be
    # cached. Keyed by west.yml: a changed manifest starts from what it can and
    # the justfile updates the rest.
    - shell: bash
      run: echo "ZELOS_WEST_VOLUME=${{ runner.temp }}/zxws" >> "$GITHUB_ENV"
    - uses: actions/cache@v6
      with:
        path: |
          ${{ runner.temp }}/zxws
          !${{ runner.temp }}/zxws/build
        key: west-${{ hashFiles('west.yml') }}
        restore-keys: west-
