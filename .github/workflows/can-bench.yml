name: can-bench

# Every job here runs a recipe from the justfile, so CI cannot diverge from what
# the guide tells a reader to run.
on:
  push:
    paths: ["can-bench/**", ".github/workflows/can-bench.yml"]
  pull_request:
    paths: ["can-bench/**", ".github/workflows/can-bench.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: can-bench

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq just

      - run: just dbc
      - name: codec/ is up to date with the DBC
        run: git diff --exit-code -- codec

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq just

      - run: just firmware

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: can-bench/build/*.elf
          if-no-files-found: error

  bench:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq just

      - name: Load the kernel's virtual CAN driver
        # SocketCAN is a kernel feature and a hosted runner does not ship it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: can-bench/build

      - run: just up
      - run: just test

      # Each notebook renders to a self-contained page. Kept on failure too,
      # which is when they are worth reading.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: can-bench/notebooks/*.html
          if-no-files-found: warn

      - if: failure()
        run: docker compose logs
      - if: always()
        run: just down
