name: serial-bench

# Every job here runs a recipe from the justfile, so CI cannot diverge from what
# the guide tells a reader to run.
#
# The bench's firmware is built from the shared directories at the root, so a
# change there runs this workflow too.
on:
  push:
    paths: &paths
      - "serial-bench/**"
      - "bench/**"
      - "nodes/console/**"
      - "lib/Kconfig"
      - "lib/CMakeLists.txt"
      - "toolchain/**"
      - "zephyr/**"
      - "west.yml"
      - "CMakeLists.txt"
      - "Kconfig"
      - "justfile"
      - ".github/actions/**"
      - ".github/workflows/serial-bench.yml"
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: serial-bench

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/firmware-toolchain

      - run: just build

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: serial-bench/build/*.elf
          if-no-files-found: error

  bench:
    runs-on: ubuntu-latest
    needs: firmware
    env:
      SERIAL_EXTENSION_DIR: ${{ github.workspace }}/zelos-extension-serial
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      # The extension under test, installed by the agent at start until it is
      # on the marketplace; see compose.yaml.
      - uses: actions/checkout@v4
        with:
          repository: zeloscloud/zelos-extension-serial
          ref: c71a2827555a66b0e6b78fa7c3d2b2f4420fc652
          path: zelos-extension-serial

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: serial-bench/build

      - run: just up
      - run: just test

      # Each notebook renders to a self-contained page. Kept on failure too,
      # which is when they are worth reading.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: serial-bench/notebooks/*.html
          if-no-files-found: warn

      - if: failure()
        run: docker compose logs
      - if: always()
        run: just down
