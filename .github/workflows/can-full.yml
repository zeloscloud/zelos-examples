name: can-full

# Every job here runs a recipe from the justfile, so CI cannot diverge from what
# the guide tells a reader to run.
#
# The bench's firmware, Renode bench and suites are shared at the root, so a
# change there runs this workflow too.
on:
  push:
    paths: &paths
      - "can-full/**"
      - "bench/**"
      - "testing/**"
      - "nodes/**"
      - "lib/**"
      - "include/**"
      - "snippets/**"
      - "dbc/**"
      - "tools/**"
      - "toolchain/**"
      - "zephyr/**"
      - "west.yml"
      - "CMakeLists.txt"
      - "Kconfig"
      - "justfile"
      - ".github/workflows/can-full.yml"
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: can-full

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq just

      - run: just firmware

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            can-full/build/*.elf
            can-full/build/*.a2l
          if-no-files-found: error

  bench:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq just

      - name: Load the kernel's virtual CAN driver
        # SocketCAN is a kernel feature and a hosted runner does not ship it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: can-full/build

      - run: just up
      - run: just test

      - if: failure()
        run: docker compose logs
      - if: always()
        run: just down

  # The raw-CAN DC-DC suite plays the BMS, so it cannot run on the bench above,
  # which has one. It gets a bench of its own, the DC-DC alone.
  can-raw:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq just

      - name: Load the kernel's virtual CAN driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: can-full/build

      - run: just test-bench can_raw can-full/build/dcdc-xcp.elf
        working-directory: .
