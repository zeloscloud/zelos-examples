name: can-full

# Every job here runs a recipe from the justfile, so CI cannot diverge from what
# the guide tells a reader to run.
#
# The bench's firmware, Renode bench and suites are shared at the root, so a
# change there runs this workflow too.
#
# Every push and pull request runs the core suites (`just test`, about ten
# minutes). The whole set (`just test-all`, three times that under Renode) runs
# on a pull request labelled `ci-full`, on demand, and weekly, so the suites
# that only their own area's work exercises cannot rot unseen.
on:
  push:
    paths: &paths
      - "can-full/**"
      - "bench/**"
      - "testing/**"
      - "nodes/**"
      - "lib/**"
      - "include/**"
      - "snippets/**"
      - "dbc/**"
      - "arxml/**"
      - "tools/**"
      - "toolchain/**"
      - "zephyr/**"
      - "west.yml"
      - "CMakeLists.txt"
      - "Kconfig"
      - "justfile"
      - ".github/actions/**"
      - ".github/workflows/can-full.yml"
  pull_request:
    paths: *paths
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

env:
  FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: can-full

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/firmware-toolchain

      - run: just build

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            can-full/build/*.elf
            can-full/build/*.a2l
          if-no-files-found: error

  bench:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Load the kernel's virtual CAN driver
        # SocketCAN is a kernel feature and a hosted runner does not ship it.
        # Newer kernels (7.0 azure) carry vcan in linux-modules, which the runner
        # has; older ones in linux-modules-extra, which it does not.
        run: |
          sudo modprobe vcan || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          }

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: can-full/build

      - run: just up
      - if: env.FULL != 'true'
        run: just test
      - if: env.FULL == 'true'
        run: just test-all
      - if: failure()
        run: docker compose logs
      - if: always()
        run: just down

      # The raw-CAN DC-DC suite plays the BMS, so it cannot run on the bench
      # above, which has one. It gets a bench of its own, the image alone, and
      # runs whether or not the full bench passed.
      - if: "!cancelled()"
        run: just test-bench can_raw can-full/build/full.elf
        working-directory: .
      # The OBD suite's fault tests fall silent as the BMS; same bench of its own.
      - if: "!cancelled() && env.FULL == 'true'"
        run: just test-bench obd can-full/build/full.elf
        working-directory: .
