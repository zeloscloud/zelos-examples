name: cad

# Every job here runs a recipe from cad/justfile, so CI cannot diverge from
# what a reader runs. A PR gets the STEP, STL and views of every part as an
# artifact, so a reviewer looks at the geometry without building it.
on:
  push:
    paths: &paths
      - "cad/**"
      - ".github/workflows/cad.yml"
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cad

jobs:
  parts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: just init
      - run: just test
      - run: just build-all

      - uses: actions/upload-artifact@v4
        with:
          name: parts
          path: |
            cad/*/build/*.step
            cad/*/build/*.stl
            cad/*/build/views.png
          if-no-files-found: error
