# Changes to the pinned modules, applied by `west patch apply` when just updates
# the workspace (justfile, _west).
patches:
  - path: zephyr/isotp-stray-fc.patch
    sha256sum: 5cb6e229cd16e0279e8583d1c4177806c8aef055d2d01202332a10f31e3ed376
    module: zephyr
    author: Taylor Keairns
    email: taylor@zeloscloud.io
    date: 2026-10-17
    upstreamable: true
    comments: |
      ISO-TP and a second tester's flow control (ISO 15765-2: an unexpected FC
      is ignored). Sender: an FC before the FF or the block's last CF went out
      was taken as the one due and released a CF while a frame was pending,
      which the M_CAN priority queue could send first; now ignored, and one
      frame is in flight at a time. Receiver: an FC aborted a request being received, or
      discarded one just received; now ignored.
