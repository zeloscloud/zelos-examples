CONFIG_ZTEST=y
# lib/can on native_sim's loopback controller.
CONFIG_CAN=y
CONFIG_ZELOS_CAN=y
# Small, so filling it is quick.
CONFIG_ZELOS_CAN_TX_QUEUE_DEPTH=8
# Short, so going stale is quick.
CONFIG_ZELOS_CAN_TX_MAX_AGE_MS=50
# Built here until its first user (UDS) lands, so it cannot rot.
CONFIG_ZELOS_REBOOT=y
