name: serial-bench

# Two emulated boards serving their consoles on TCP, and an agent recording
# both with the Serial extension.
#
# Each board has its own Renode: in one process the two machines share a clock,
# and Linux booting slowed the Zephyr node to 0.08x real time. All three
# services share renode-zephyr's network namespace, so the agent reaches the
# consoles on 127.0.0.1:4001 and :4002 and nothing but the agent's port is
# published.

x-sim: &sim
  build:
    context: ../bench
    dockerfile: renode.Dockerfile
  image: zelos-bench-sim:1.16.1
  pull_policy: build

services:
  # The console node, nodes/console, on 4001.
  renode-zephyr:
    <<: *sim
    # 2300 is what the app assumes for a bare hostname; set BENCH_PORT to
    # publish elsewhere.
    ports:
      - "${BENCH_PORT:-2300}:2300"
    volumes:
      - ./console.resc:/bench/console.resc:ro
      - ./build:/elf:ro
    command: ["renode", "--disable-gui", "--hide-monitor", "-P", "1234", "/bench/console.resc"]
    # Healthy once the console is listening. Not by connecting: the first
    # client to connect receives everything Renode held back, so a probe would
    # take the boot output before the agent could.
    healthcheck:
      test: ["CMD", "bash", "-c", "ss -Hltn 'sport = :4001' | grep -q LISTEN"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 20s

  # Linux on a Cortex-A53, Renode's stock demo, on 4002. Every start
  # downloads a 64 MiB image, about 40 s, before the console listens.
  renode-linux:
    <<: *sim
    network_mode: "service:renode-zephyr"
    volumes:
      - ./linux.resc:/bench/linux.resc:ro
    # Its own monitor port: the namespace is shared with renode-zephyr.
    command: ["renode", "--disable-gui", "--hide-monitor", "-P", "1235", "/bench/linux.resc"]
    healthcheck:
      test: ["CMD", "bash", "-c", "ss -Hltn 'sport = :4002' | grep -q LISTEN"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 120s

  # The shared agent with the Serial extension, recording with serial.json.
  # Its own image name, so it does not replace the CAN benches' image, which
  # holds the CAN extension.
  agent:
    extends:
      file: ../bench/compose.yaml
      service: agent
    image: zelos-bench-agent-serial
    build:
      args:
        EXTENSION: zeloscloud/zelos-extension-serial
        EXTENSION_VERSION: v0.1.0
    network_mode: "service:renode-zephyr"
    depends_on: !override
      renode-zephyr:
        condition: service_healthy
      renode-linux:
        condition: service_healthy
    environment:
      BENCH_EXTENSION: zeloscloud.zelos-extension-serial
      BENCH_CONFIG: /bench/serial.json
    volumes: !override
      - ./serial.json:/bench/serial.json:ro
      # Writable: the notebook runner assigns cell ids and stages a
      # provisioning script beside each notebook.
      - ./notebooks:/notebooks
