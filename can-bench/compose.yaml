name: can-bench

# Three services and one virtual CAN bus.
#
# Built on the repository's shared bench (../bench): this file picks the nodes
# and configures the agent. `bus` owns the network namespace the
# bus lives in; `renode` and `agent` join it. All three see the same vcan0 with
# no routing, and the interface lives and dies with the containers rather than
# existing on the host.

services:
  bus:
    extends:
      file: ../bench/compose.yaml
      service: bus
    # 2300 is what the app assumes for a bare hostname. On a machine where the
    # app is installed its own agent already holds that port; set BENCH_PORT to
    # publish elsewhere.
    ports:
      - "${BENCH_PORT:-2300}:2300"

  renode:
    extends:
      file: ../bench/compose.yaml
      service: renode
    volumes:
      - ./build:/elf:ro
    environment:
      # Which build of the DC-DC node to run. `just flash` sets this.
      BENCH_ELFS: vcu.elf bms.elf ${DCDC_ELF:-dcdc.elf}

  # The shared agent image, decoding with this bench's bench/can.json.
  agent:
    build:
      context: ../bench
      dockerfile: agent.Dockerfile
    image: zelos-bench-agent:26.0.8
    pull_policy: build
    depends_on:
      renode:
        condition: service_healthy
    network_mode: "service:bus"
    volumes:
      # Mounted rather than copied into the image, so editing it takes effect
      # on the next `just up`.
      - ./bench:/bench:ro
      - ../dbc:/dbc:ro
      # Recorded runs the tests check against, and where `just record` writes.
      - ./traces:/traces
      # Writable: the notebook runner assigns cell ids and stages a
      # provisioning script beside each notebook.
      - ./notebooks:/notebooks
    healthcheck:
      test: ["CMD", "zelos", "status"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
