# Zephyr workspace for the CAN bench, pinned to a tag.
#
# The allowlist keeps the workspace to what an STM32 CAN application needs.
# cmsis_6 is the Cortex-M module; cmsis is Cortex-A/R and fails obscurely here.
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.2
      import:
        name-allowlist:
          - cmsis_6
          - hal_stm32

  self:
    path: can-bench
