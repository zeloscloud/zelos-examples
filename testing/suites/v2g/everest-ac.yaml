# EVerest 2025.10.0: a simulated AC EVSE and EV over ISO 15118-20, from the
# image's config-sil-ac-d20.yaml. The broker, the standalone EV and the veth
# are everest.yaml's. conftest.py sets, per run, the energy services the EV
# offers and EvManager's script.
settings:
  mqtt_broker_socket_path: /run/mqtt.sock
active_modules:
  iso15118_charger:
    module: Evse15118D20
    config_module:
      device: v2g-evse
      # Plain TCP: the capture's EXI is readable.
      tls_negotiation_strategy: ENFORCE_NO_TLS
      logging_path: /tmp/everest-logs
    connections:
      security:
        - module_id: evse_security
          implementation_id: main
  iso15118_car:
    module: PyEvJosev
    standalone: true
    config_module:
      device: v2g-ev
      supported_ISO15118_20_AC: true
      supported_d20_energy_services: set by conftest.py
      tls_active: false
  evse_manager:
    module: EvseManager
    config_module:
      connector_id: 1
      evse_id: DE*PNX*E12345*1
      session_logging: true
      session_logging_xml: false
      session_logging_path: /tmp/everest-logs
      charge_mode: AC
      ac_hlc_enabled: true
      ac_hlc_use_5percent: false
      ac_enforce_hlc: false
      ac_nominal_voltage: 230
      supported_iso_ac_bpt: true
      has_ventilation: true
      max_current_import_A: 32
      max_current_export_A: 32
      payment_enable_contract: false
      payment_enable_eim: true
      bpt_channel: Unified
      bpt_generator_mode: GridFollowing
      bpt_grid_code_island_method: Passive
    connections:
      bsp:
        - module_id: yeti_driver
          implementation_id: board_support
      powermeter_car_side:
        - module_id: yeti_driver
          implementation_id: powermeter
      slac:
        - module_id: slac
          implementation_id: evse
      hlc:
        - module_id: iso15118_charger
          implementation_id: charger
      ac_rcd:
        - module_id: yeti_driver
          implementation_id: rcd
      connector_lock:
        - module_id: yeti_driver
          implementation_id: connector_lock
  yeti_driver:
    module: YetiSimulator
    config_module:
      connector_id: 1
  # SLAC in process: no HomePlug frames on the link.
  slac:
    module: SlacSimulator
  ev_manager:
    module: EvManager
    config_module:
      connector_id: 1
      auto_enable: true
      auto_exec: true
      auto_exec_commands: set by conftest.py
    connections:
      ev_board_support:
        - module_id: yeti_driver
          implementation_id: ev_board_support
      ev:
        - module_id: iso15118_car
          implementation_id: ev
      slac:
        - module_id: slac
          implementation_id: ev
  auth:
    module: Auth
    config_module:
      connection_timeout: 10
      selection_algorithm: FindFirst
    connections:
      token_provider:
        - module_id: token_provider
          implementation_id: main
      token_validator:
        - module_id: token_validator
          implementation_id: main
      evse_manager:
        - module_id: evse_manager
          implementation_id: evse
  token_provider:
    module: DummyTokenProvider
    config_implementation:
      main:
        token: TOKEN1
    connections:
      evse:
        - module_id: evse_manager
          implementation_id: evse
  token_validator:
    module: DummyTokenValidator
    config_implementation:
      main:
        validation_result: Accepted
        validation_reason: Token seems valid
        sleep: 0.25
  evse_security:
    module: EvseSecurity
    config_module:
      private_key_password: "123456"
  energy_manager:
    module: EnergyManager
    connections:
      energy_trunk:
        - module_id: grid_connection_point
          implementation_id: energy_grid
  grid_connection_point:
    module: EnergyNode
    config_module:
      fuse_limit_A: 40.0
      phase_count: 3
    connections:
      price_information: []
      energy_consumer:
        - module_id: evse_manager
          implementation_id: energy_grid
      powermeter:
        - module_id: yeti_driver
          implementation_id: powermeter
